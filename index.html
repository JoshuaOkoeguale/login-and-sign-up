<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login and Sign Up Form</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>

    <main class="auth-wrapper">
      <div class="auth-card" id="authCard">
        <!-- Login panel -->
        <section class="form-panel login-panel">
          <div class="logo">
            <i class="fa-solid fa-lock"></i>
          </div>

          <h1>Welcome</h1>
          <p class="subtitle">Login to continue your journey</p>

          <form id="loginForm">
            <div class="input-group">
              <input
                type="email"
                id="loginEmail"
                name="email"
                placeholder=" "
                autocomplete="email"
                required
              />
              <label for="loginEmail">Email Address</label>
            </div>

            <div class="input-group password-group">
              <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder=" "
                autocomplete="current-password"
                required
              />
              <label for="loginPassword">Password</label>

              <button
                type="button"
                class="password-toggle"
                aria-label="Show password"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>

            <div class="options">
              <label class="checkbox">
                <input type="checkbox" name="remember" />
                Remember me
              </label>

              <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="main-btn">Login</button>
          </form>

          <div class="switch-area">
            <span>Don't have an account?</span>

            <button type="button" class="switch-circle" id="showSignup">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>

          <div class="socials">
            <button type="button" aria-label="Login with Google">G</button>
            <button type="button" aria-label="Login with Facebook">f</button>
            <button type="button" aria-label="Login with LinkedIn">in</button>
          </div>
        </section>

        <!-- Signup panel -->
        <section class="form-panel signup-panel">
          <div class="logo">
            <i class="fa-solid fa-user"></i>
          </div>

          <h1>Create Account</h1>
          <p class="subtitle">Start your journey with us</p>

          <form id="signupForm">
            <div class="input-group">
              <input
                type="text"
                id="signupName"
                name="name"
                placeholder=" "
                autocomplete="name"
                required
              />
              <label for="signupName">Full Name</label>
            </div>

            <div class="input-group">
              <div class="electric-glow"></div>
              <div class="electric-border"></div>
              <input
                type="email"
                id="signupEmail"
                name="email"
                placeholder=" "
                autocomplete="email"
                required
              />
              <label for="signupEmail">Email Address</label>
            </div>

            <div class="input-group password-group">
              <input
                type="password"
                id="signupPassword"
                name="password"
                placeholder=" "
                autocomplete="new-password"
                required
              />
              <label for="signupPassword">Password</label>

              <button
                type="button"
                class="password-toggle"
                aria-label="Show password"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>

            <div class="input-group">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder=" "
                autocomplete="new-password"
                required
              />
              <label for="confirmPassword">Confirm Password</label>
            </div>

            <button type="submit" class="main-btn">Create Account</button>
          </form>

          <div class="switch-area">
            <span>Already have an account?</span>

            <button type="button" class="switch-circle" id="showLogin">
              <i class="fa-solid fa-arrow-left"></i>
            </button>
          </div>

          <div class="socials">
            <button type="button" aria-label="Sign up with Google">G</button>
            <button type="button" aria-label="Sign up with Facebook">f</button>
            <button type="button" aria-label="Sign up with LinkedIn">in</button>
          </div>
        </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
